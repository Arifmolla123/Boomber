<!DOCTYPE html>
<html>
<head><title>Dashboard</title></head>
<body>
<h2>Welcome, {{ user }}</h2>
<a href="/create_link">+ Create New Phishing Link</a>
<h3>Your Links</h3>
<ul>
    {% for link in links %}
    <li>
        <code>{{ request.host_url }}f/{{ link.link_id }}</code> ({{ link.template }}) - {{ link.created_at }}
        <a href="/submissions/{{ link.link_id }}">View Submissions</a>
    </li>
    {% endfor %}
</ul>
<a href="/logout">Logout</a>
</body>
</html>
